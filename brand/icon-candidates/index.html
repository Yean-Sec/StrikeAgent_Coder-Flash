<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StrikeAgent Coder-Flash · 图标方案</title>
  <style>
    :root {
      --canvas: #faf9f5;
      --ink: #141413;
      --body: #3d3d3a;
      --muted: #6c6a64;
      --hairline: #e6dfd8;
      --coral: #cc785c;
      --dark: #181715;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      padding: 48px 32px 80px;
    }
    h1 {
      font-family: "Tiempos Headline", "Cormorant Garamond", Georgia, serif;
      font-weight: 400;
      font-size: 36px;
      letter-spacing: -0.5px;
      margin: 0 0 8px;
    }
    p.lead {
      color: var(--muted);
      margin: 0 0 40px;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 28px;
      max-width: 1200px;
    }
    figure {
      margin: 0;
    }
    img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 28px;
      border: 1px solid var(--hairline);
      background: #fff;
      display: block;
    }
    figcaption {
      margin-top: 12px;
    }
    .num {
      font-variant-numeric: tabular-nums;
      color: var(--coral);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .name {
      display: block;
      margin-top: 4px;
      font-size: 16px;
      color: var(--ink);
    }
    .desc {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <h1>StrikeAgent Coder-Flash</h1>
  <p class="lead">10 个图标方案 · 回复编号即可选定</p>
  <div class="grid">
    <figure>
      <img src="01-braces.png" alt="01 校对花括号" />
      <figcaption>
        <span class="num">01</span>
        <span class="name">校对花括号</span>
        <span class="desc">{ } 中间一枚珊瑚星</span>
      </figcaption>
    </figure>
    <figure>
      <img src="02-scan-c.png" alt="02 扫描线 C" />
      <figcaption>
        <span class="num">02</span>
        <span class="name">扫描线 C</span>
        <span class="desc">代码行弯成 C，斜向扫描光</span>
      </figcaption>
    </figure>
    <figure>
      <img src="03-serif-c.png" alt="03 衬线 C" />
      <figcaption>
        <span class="num">03</span>
        <span class="name">衬线 C</span>
        <span class="desc">开口里一颗珊瑚校对点</span>
      </figcaption>
    </figure>
    <figure>
      <img src="04-aperture.png" alt="04 对焦菱形" />
      <figcaption>
        <span class="num">04</span>
        <span class="name">对焦菱形</span>
        <span class="desc">珊瑚底，中心十字对焦点</span>
      </figcaption>
    </figure>
    <figure>
      <img src="05-folded.png" alt="05 翻页源码" />
      <figcaption>
        <span class="num">05</span>
        <span class="name">翻页源码</span>
        <span class="desc">掀开代码页，露出珊瑚层</span>
      </figcaption>
    </figure>
    <figure>
      <img src="06-code-flash.png" alt="06 代码闪电" />
      <figcaption>
        <span class="num">06</span>
        <span class="name">代码闪电</span>
        <span class="desc">三行代码打断一道闪电</span>
      </figcaption>
    </figure>
    <figure>
      <img src="07-split-spark.png" alt="07 明暗火花" />
      <figcaption>
        <span class="num">07</span>
        <span class="name">明暗火花</span>
        <span class="desc">奶油 / 深色对切，中间火花</span>
      </figcaption>
    </figure>
    <figure>
      <img src="08-sc-ligature.png" alt="08 SC 连字" />
      <figcaption>
        <span class="num">08</span>
        <span class="name">SC 连字</span>
        <span class="desc">衬线 S 叠 C，校对红线</span>
      </figcaption>
    </figure>
    <figure>
      <img src="09-nested-frames.png" alt="09 层层下钻" />
      <figcaption>
        <span class="num">09</span>
        <span class="name">层层下钻</span>
        <span class="desc">同心圆角框，中心珊瑚块</span>
      </figcaption>
    </figure>
    <figure>
      <img src="10-flash-crystal.png" alt="10 闪光晶体" />
      <figcaption>
        <span class="num">10</span>
        <span class="name">闪光晶体</span>
        <span class="desc">暖橙底上的折光晶体</span>
      </figcaption>
    </figure>
  </div>
</body>
</html>
